<svg baseProfile="tiny" height="297mm" version="1.2" viewBox="0,0,210,297" width="210mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><text font-family="Cooper Black" font-size="8mm" text-anchor="middle" x="105.0" y="18.0">Göttingern - Barbara</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="22.5" y="36.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="72.5" y="36.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="110.0" y="36.0">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="170.0" y="36.0">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="212.5" y="36.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="272.5" y="36.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="302.5" y="36.0">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="335.0" y="36.0">E7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="370.0" y="36.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="425.0" y="36.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="472.5" y="36.0">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="530.0" y="36.0">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="580.0" y="36.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="635.0" y="36.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="677.5" y="36.0">E7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="710.0" y="36.0">Am</text><text fill="black" font-family="DejaVu Sans" font-size="4mm" x="10.0" y="38.5">Bien sûr ce n'est pas la Seine       Ce n'est pas le Bois de Vincennes      Mais c'est bien joli tout de même      À Göttingen, à Göttigen  Pas de quais et pas de rengaines         Qui se lamentent et qui se traînent     Mais l'amour y fleurit quand même           À Göttingen, à Göttingen </text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="20.0" y="44.5">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="82.5" y="44.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="137.5" y="44.5">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="192.5" y="44.5">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="227.5" y="44.5">A7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="277.5" y="44.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="305.0" y="44.5">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="325.0" y="44.5">E7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="347.5" y="44.5">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="395.0" y="44.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="442.5" y="44.5">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="497.5" y="44.5">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="552.5" y="44.5">A7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="600.0" y="44.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="625.0" y="44.5">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="645.0" y="44.5">E7</text><text fill="black" font-family="DejaVu Sans" font-size="4mm" x="10.0" y="47.0">Ils savent mieux que nous je pense           L'histoire de nos rois de France       Herman, Peter, Elga et Hans,      À Gottingen  Et que personne ne s'offense         Mais les contes de notre enfance             "It était une fois" commencent   À Gottingen </text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="22.5" y="53.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="80.0" y="53.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="127.5" y="53.0">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="182.5" y="53.0">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="230.0" y="53.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="290.0" y="53.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="335.0" y="53.0">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="367.5" y="53.0">E7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="407.5" y="53.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="462.5" y="53.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="517.5" y="53.0">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="565.0" y="53.0">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="602.5" y="53.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="652.5" y="53.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="680.0" y="53.0">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="712.5" y="53.0">E7</text><text fill="black" font-family="DejaVu Sans" font-size="4mm" x="10.0" y="55.5">Bien sûr nous nous avons la Seine           Et puis notre bois de Vincennes        Mais Dieu que les roses sont belles          À Göttingen, à Göttingen  Nous nous avons nos matins blêmes             Et l'aube grise de Verlaine     Eux c'est la mélancolie même      À Göttingen, à Göttingen </text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="25.0" y="61.5">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="85.0" y="61.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="120.0" y="61.5">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="172.5" y="61.5">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="220.0" y="61.5">A7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="285.0" y="61.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="330.0" y="61.5">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="390.0" y="61.5">E7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="422.5" y="61.5">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="487.5" y="61.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="517.5" y="61.5">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="570.0" y="61.5">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="635.0" y="61.5">A7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="695.0" y="61.5">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="717.5" y="61.5">B7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="760.0" y="61.5">E7</text><text fill="black" font-family="DejaVu Sans" font-size="4mm" x="10.0" y="64.0">Quand ils ne savent rien nous dire      Ils restent là à nous sourire          Mais nous les comprenons quand même          Les enfants blonds de Gottingen       Et tant pis pour ceux qui s'étonnent  Et que les autres me pardonnent              Mais les enfants ce sont les mêmes  A Paris ou à Gottingen </text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="17.5" y="70.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="72.5" y="70.0">Dm</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="97.5" y="70.0">G7</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="155.0" y="70.0">C</text><text fill="red" font-family="DejaVu Sans" font-size="4.5mm" x="197.5" y="70.0">Am</text><text fill="red" font-family="DejaVu Sans" font-size="4.